apiVersion: apps/v1
kind: Deployment
metadata:
  name: mavhu-web-app
  labels:
    app: mavhu-web-app
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: mavhu-web-app
  template:
    metadata:
      labels:
        app: mavhu-web-app
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: mavhu-web-app
          # Tag format produced by the pipeline: <branch>-v<semver>
          image: ghcr.io/princemakaza/mavhu-web-app/mavhu-web-app:main-v0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: mavhu-web-app
  labels:
    app: mavhu-web-app
spec:
  type: ClusterIP
  selector:
    app: mavhu-web-app
  ports:
    - name: http
      port: 80
      targetPort: http
