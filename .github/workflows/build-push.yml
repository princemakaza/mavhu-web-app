name: Build and push image

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
      - testing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: mavhu-web-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Type check and build
        run: npm run build

  build-push:
    needs: build
    runs-on: ubuntu-latest
    # One GitHub environment per branch (dev / testing / main), each holding its own VITE_API_URL variable
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # paulhatch/semantic-version needs full history + tags to compute an incrementing version

      - name: Set current branch name
        run: echo "BRANCH_NAME=${GITHUB_REF##*/}" >> $GITHUB_ENV

      - name: Set lowercase repository (owner/repo)
        id: repo
        shell: bash
        run: echo "repo_lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Increment semantic version
        uses: paulhatch/semantic-version@v5.4.0
        id: versioning
        with:
          bump_each_commit: true
          tag_prefix: "v"

      - name: Set image reference
        run: echo "IMAGE=ghcr.io/${{ steps.repo.outputs.repo_lc }}/${{ env.IMAGE_NAME }}:${{ env.BRANCH_NAME }}-v${{ steps.versioning.outputs.version }}" >> $GITHUB_ENV

      - name: Login to image registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          provenance: false
          sbom: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: echo "Pushed \`${{ env.IMAGE }}\`" >> $GITHUB_STEP_SUMMARY
